[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plastic"
version = "0.1.0"
description = "plastic: a tiny test-time-training state-space model (TTT-SSM) with a transactional safety harness"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["test-time training", "TTT", "state space model", "SSM", "fast weights", "delta rule", "AI safety"]
dependencies = [
    "torch>=2.12",
    "numpy>=2.0",
    "fastapi>=0.128",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "huggingface_hub>=1.32",
    "tokenizers>=0.21",
    "datasets>=3.0",
]

[project.optional-dependencies]
pretrained = [
    "transformers==5.17.0",
]
dev = [
    "pytest>=9.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[project.scripts]
plastic = "plastic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["plastic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]
